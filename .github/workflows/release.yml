name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v* tag to release or resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "7e07f4e74ec1e92a6ead9aa1e66054af3e133aac"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install exact BlueMap add-on toolkit
        if: ${{ hashFiles('requirements/toolkit.txt') != '' }}
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps --require-hashes --only-binary=:all: \
            --requirement requirements/toolkit.txt
          toolkit_version="$(sed -n \
            's#^bluemap-addon-toolkit @ .*/releases/download/v\([^/]*\)/.*#\1#p' \
            requirements/toolkit.txt)"
          [[ "${toolkit_version}" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "$(bluemap-addon-toolkit --version)" = "${toolkit_version}"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Acquire exact ephemeral Mekanism inputs
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/Mekanism-1.21.1-10.7.19.85.jar" \
            "https://www.curseforge.com/api/v1/mods/268560/files/7904058/download"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/MekanismGenerators-1.21.1-10.7.19.85.jar" \
            "https://www.curseforge.com/api/v1/mods/268566/files/7904061/download"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/mekanismcovers-1.3-BETA+1.21.jar" \
            "https://www.curseforge.com/api/v1/mods/1119874/files/6071684/download"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/mekmm-1.21.1-1.3.3.jar" \
            "https://www.curseforge.com/api/v1/mods/1275257/files/7919872/download"
          test "$(stat -c %s "${input_dir}/Mekanism-1.21.1-10.7.19.85.jar")" \
            -eq 11976009
          test "$(stat -c %s "${input_dir}/MekanismGenerators-1.21.1-10.7.19.85.jar")" \
            -eq 1114598
          test "$(stat -c %s "${input_dir}/mekanismcovers-1.3-BETA+1.21.jar")" \
            -eq 136513
          test "$(stat -c %s "${input_dir}/mekmm-1.21.1-1.3.3.jar")" \
            -eq 2983024
          sha256sum --check <<SHA256SUMS
          004dbc9f3106f4d192aeaa1ee1190dd16ec9ca8059ed3d093b80034f4c574f43  ${input_dir}/Mekanism-1.21.1-10.7.19.85.jar
          0e5783b111e756f27b48c62b2f0e02fff750c77f7985ff809bfadc5f444ba4ac  ${input_dir}/MekanismGenerators-1.21.1-10.7.19.85.jar
          7e67b8f5c111ef0d94abcd0c24580fa74c0532dbfa9e5cdbf58521e57cbbdc95  ${input_dir}/mekanismcovers-1.3-BETA+1.21.jar
          aebd1136a2e328a23d1801c768b387cf336bc1ebdab40770274d068bdaac9a12  ${input_dir}/mekmm-1.21.1-1.3.3.jar
          SHA256SUMS

      - name: Build and verify accepted bytes
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PmekanismJar="${input_dir}/Mekanism-1.21.1-10.7.19.85.jar" \
            -PmekanismGeneratorsJar="${input_dir}/MekanismGenerators-1.21.1-10.7.19.85.jar" \
            -PmekanismCoversJar="${input_dir}/mekanismcovers-1.3-BETA+1.21.jar" \
            -PmoreMachineJar="${input_dir}/mekmm-1.21.1-1.3.3.jar" \
            "-PreleaseTag=${RELEASE_TAG}" \
            clean build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyReleaseCandidate

      - name: Prepare release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-mekanism-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-mekanism-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-mekanism-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-mekanism-addon-${VERSION}.module.json"
          (cd release && sha256sum -- ./* > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Mekanism Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release JARs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.jar

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PmekanismJar="${RUNNER_TEMP}/exact-inputs/Mekanism-1.21.1-10.7.19.85.jar" \
            -PmekanismGeneratorsJar="${RUNNER_TEMP}/exact-inputs/MekanismGenerators-1.21.1-10.7.19.85.jar" \
            -PmekanismCoversJar="${RUNNER_TEMP}/exact-inputs/mekanismcovers-1.3-BETA+1.21.jar" \
            -PmoreMachineJar="${RUNNER_TEMP}/exact-inputs/mekmm-1.21.1-1.3.3.jar" \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
